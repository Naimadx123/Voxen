# Minimum delay between any two chat messages per player (empty = disabled).
cooldown: 1s

# Blocks sending the exact same message twice within the window.
anti-repeat:
  enabled: true
  window-seconds: 30
  # Also catches slightly changed repeats like "hi there" after "hi there!".
  # threshold: how alike two messages must be, from 0.0 to 1.0.
  # history: how many recent messages to compare against.
  similarity:
    enabled: false
    threshold: 0.85
    history: 3

# Blocked words and regex patterns. mode: block (reject the message) or censor (mask matches).
filter:
  enabled: true
  mode: censor
  censor-char: "*"
  words: []
  # Optional extra word list file, one word per line, '#' starts a comment.
  # The path is relative to the plugin folder, e.g. "blocked-words.txt".
  words-file: ""
  patterns: []
  # Catches bypass attempts like "d4rn", "d.a.r.n", "dąrn" or "daaarn".
  # Applies to words only, not patterns.
  # repeated collapses runs of the same letter, so "aa" and "aaa" both count as "a".
  normalize:
    leetspeak: true
    diacritics: true
    separators: true
    repeated: true

# Blocks links and IP addresses. mode: block (reject the message) or censor (mask the link).
# Anything on the whitelist is allowed, including its subdomains.
links:
  enabled: false
  mode: block
  ips: true
  whitelist:
    - youtube.com
    - youtu.be

# Lets staff raise a channel's cooldown on the fly with /voxen slowmode <channel> <time>.
# The setting is not saved, so a restart clears it.
slowmode:
  enabled: true

# Stores sent messages so staff can read them back with /voxen history <player>.
history:
  enabled: false
  # Entries older than this are deleted on startup. 0 keeps them forever.
  keep-days: 14
  # How many of the newest messages /voxen history shows.
  entries: 15

# How many blank lines /voxen chatclear sends.
chat-clear-lines: 100
