# Minimum delay between any two chat messages per player (empty = disabled).
cooldown: 1s
# Whether the cooldown also counts private messages. Off by default, a conversation
# in /msg goes back and forth faster than public chat.
cooldown-affect-pm: false

# Rejects messages longer than this many characters. chars: 0 turns it off.
max-length:
  chars: 0
  affect-pm: true

# Blocks sending the exact same message twice within the window.
anti-repeat:
  enabled: true
  # Whether repeats in private messages count too. Off by default, "ok" twice in
  # a conversation is normal.
  affect-pm: false
  window-seconds: 30
  # Also catches slightly changed repeats like "hi there" after "hi there!".
  # threshold: how alike two messages must be, from 0.0 to 1.0.
  # history: how many recent messages to compare against.
  similarity:
    enabled: false
    threshold: 0.85
    history: 3

# Blocks messages that are just noise, like "aaaaaaaaaaaa" or a wall of random keys.
# max-run: how many identical characters in a row are still allowed.
# max-word-length: longest allowed word; anything containing '.', ':' or '/' is left
# to the link filter instead. 0 turns a check off.
anti-flood:
  enabled: true
  # Whether private messages are checked for noise too.
  affect-pm: true
  max-run: 8
  max-word-length: 30

# Blocked words and regex patterns. mode: block (reject the message) or censor (mask matches).
filter:
  enabled: true
  # Whether blocked words are also caught in private messages.
  affect-pm: true
  mode: censor
  censor-char: "*"
  words: []
  # Optional extra word list file, one word per line, '#' starts a comment.
  # The path is relative to the plugin folder, e.g. "blocked-words.txt".
  words-file: ""
  patterns: []
  # Catches bypass attempts like "d4rn", "d.a.r.n", "dąrn" or "daaarn".
  # Applies to words only, not patterns.
  # repeated collapses runs of the same letter, so "aa" and "aaa" both count as "a".
  normalize:
    leetspeak: true
    diacritics: true
    separators: true
    repeated: true

# Custom font characters, the ones Nexo, Oraxen and ItemsAdder call glyphs or emojis.
# Those plugins check their own permission when they turn ':name:' into a glyph, but a player
# who copies the finished character straight into chat never goes through that check, so the
# glyph renders anyway. This removes them again unless the player holds 'voxen.chat.glyphs'.
# mode: censor (drop the glyphs, keep the message) or block (refuse the whole message).
glyphs:
  enabled: false
  mode: "censor"
  affects-private-messages: true

# Blocks links and IP addresses. mode: block (reject the message) or censor (mask the link).
# Anything on the whitelist is allowed, including its subdomains.
links:
  enabled: false
  # Whether links are also caught in private messages.
  affect-pm: true
  mode: block
  ips: true
  # Also catches addresses written with a comma or apostrophe instead of a dot,
  # like "play,server,pl". Only endings that look like a real domain count,
  # so "hello, world" stays fine.
  obfuscated: true
  whitelist:
    - youtube.com
    - youtu.be

# Lets staff raise a channel's cooldown on the fly with /voxen slowmode <channel> <time>.
# The setting is not saved, so a restart clears it.
slowmode:
  enabled: true

# Stores sent messages so staff can read them back with /voxen history <player>.
history:
  enabled: false
  # Whether private messages are stored as well. They then show up in
  # /voxen history under the channel name '@pm'.
  affect-pm: false
  # Entries older than this are deleted on startup. 0 keeps them forever.
  keep-days: 14
  # How many of the newest messages /voxen history shows.
  entries: 15

# How many blank lines /voxen chatclear sends.
chat-clear-lines: 100
