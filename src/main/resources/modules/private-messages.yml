enabled: true

sender-format: "<gray>[<gold>You</gold> → <gold><target></gold>]</gray> <white><message></white>"
receiver-format: "<gray>[<gold><player></gold> → <gold>You</gold>]</gray> <white><message></white>"
spy-format: "<dark_gray>[Spy] <gray><player> → <target>:</gray> <message>"

# Tells both players that a moderator with social spy saw the message.
notify-monitored: false

# A player under a server-wide mute cannot send private messages either. Turn this off
# if a mute should only cover public chat. Mutes limited to one channel never apply here.
respect-mutes: true

# Group conversations: /gm create <players>, then /gm <text> talks to everyone in it.
group:
  enabled: true
  # Including the founder. 2 to 32.
  max-members: 6
  # A group with no activity for this long is dropped.
  idle-timeout: 30m
  format: "<gray>[<aqua>Group</aqua>] <gold><player></gold><dark_gray>:</dark_gray> <white><message></white>"

sound:
  enabled: true
  key: "minecraft:block.note_block.pling"
  source: master
  volume: 1.0
  pitch: 1.5
