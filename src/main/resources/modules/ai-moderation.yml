# AI chat moderation: every message is scored by an HTTP model on a background thread and the first
# matching rule below is applied.
#
# Any provider works. 'request-body' is sent as-is with {text}, {model} and {label} replaced by
# JSON-escaped values, and 'score-path' says where the score sits in the answer ('*' = largest
# branch, digits = array index). Leave 'score-path' empty and Voxen guesses the common shapes
# ({"score":x}, {"label":l,"score":x}, {"unsafe":x} and lists of those).
enabled: false

endpoint: "http://127.0.0.1:8099/classify"
model: ""
label: "unsafe"
# Must match your provider's schema exactly, a mismatch is the usual cause of a 400.
# Blank values ("model": "" when 'model' is empty) are dropped before sending.
request-body: '{"text": {text}, "model": {model}, "labels": ["safe", {label}]}'
score-path: ""
headers: {}
#  Authorization: "Bearer secret"

timeout-millis: 1500
# Messages waiting for the model; the oldest are dropped (and counted in /voxen status) when full.
queue-size: 500
min-length: 3

# First rule whose score is reached wins, so keep the harshest one strictest.
# score: 98 and 0.98 mean the same thing. actions: delete, kick, warn, report.
rules:
  - score: 98
    actions: [delete, kick, report]
  - score: 60
    actions: [report]
#  - score: 80
#    actions: [delete, warn]
#    commands:
#      - "voxen mute <player> 10m all AI: <score>%"

