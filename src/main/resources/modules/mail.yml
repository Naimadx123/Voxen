# Offline mail. Lets players leave a message for someone who is not online.
# Mail lives in the database, so on a network every server sees the same mailbox.
# Off by default, because most servers already have mail from Essentials or a similar
# plugin. Turn it on and /mail appears after a restart.
enabled: false
# How many messages fit in one mailbox. Sending to a full mailbox is refused.
max-per-player: 30
# Delete mail older than this many days. 0 keeps it forever. Runs on startup.
expire-days: 30
# Tell a player how much unread mail is waiting when they join.
notify-on-join: true
# Allow mail to a player who is online right now. Off means they should use /msg instead.
allow-when-online: false
# Minimum wait between two mails from the same player. Empty or 0s disables it.
# voxen.bypass.cooldown skips it.
cooldown: 30s
