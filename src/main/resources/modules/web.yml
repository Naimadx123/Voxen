# The built-in web panel. It serves the staff pages that other modules register, today the
# report queue from modules/reports.yml.
#
# It speaks plain HTTP with Basic authentication, so keep it on 127.0.0.1 and reach it through
# an SSH tunnel, or put a reverse proxy with TLS in front of it. The panel refuses to start
# while a user still has the default password, one shorter than 8 characters, or a name that
# is used twice.
enabled: false

# Which address to listen on. 127.0.0.1 is only reachable from the machine itself,
# 0.0.0.0 from everywhere.
host: "127.0.0.1"
port: 8085

# Shown in the browser tab and in the top left corner.
title: "Voxen"
# The name the browser shows in its login prompt.
realm: "Voxen"
# How many requests the panel handles at the same time.
threads: 2

# Wrong passwords from one address before it is locked out, and how long that lockout lasts.
# Either one at 0 turns the lockout off, which is only sensible behind a proxy that already
# rate limits.
max-login-attempts: 10
lockout: 15m

# How often a page reloads itself while the switch on the report queue is on. The switch is
# off until it is clicked, so nobody gets a reloading page they did not ask for. Set this to
# 0 to remove the switch altogether.
auto-refresh: 5s

# Who may log in and what they see. 'permissions' are panel permissions, not Minecraft ones:
#   reports.view    - see the report queue and a single case
#   reports.manage  - claim, resolve, dismiss and delete reports, and use the custom buttons
#   reports.audit   - see the audit log of every moderator action
#   *               - everything, also every page added later
# 'reports.*' style wildcards work too.
users:
  - name: "admin"
    password: "change-me"
    permissions: ["*"]
#  - name: "moderator"
#    password: "another-password"
#    permissions: ["reports.view", "reports.manage"]

