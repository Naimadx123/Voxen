# Every hook is optional; missing plugins are skipped without errors.
placeholderapi: true
miniplaceholders: true
luckperms: true
vault-chat: true
discordsrv: true
essentials-discord: true
towny: true
factions: true
mcmmo: true

# Cross-server chat for channels with 'cross-server: true'.
# transport: none, redis, nats or rabbitmq. 'none' keeps Voxen in single-server mode.
network:
  transport: none
  server-id: server-1
  reconnect-seconds: 5
  timeout-millis: 5000
  # Broadcasts mutes and unmutes to the other servers as they happen.
  sync-mutes: true
  # Shared key that signs every cross-server message (HMAC-SHA256). Put the same random
  # string on every server. Empty means no signing, and then anyone who can reach the
  # broker can fake chat, private messages and mutes.
  secret: ""
  # Starting the network with an empty 'secret' is refused unless you say so here.
  allow-unsigned: false
  # When 'secret' is empty, take the key from the Velocity forwarding secret in
  # config/paper-global.yml instead, so you do not have to invent a second shared string.
  # Every server behind the same proxy already has it. Voxen does not use it directly, it
  # derives its own key from it. Only helps if all your servers sit behind one proxy.
  # Ignored while transport is 'none', so a single server without a proxy needs nothing here.
  use-velocity-secret: true
  # How old an incoming message may be before it is thrown away, in seconds. Stops someone
  # who copied a message off the broker from playing it back later. The clocks on your
  # servers have to agree within this window; 0 turns the check off.
  max-age-seconds: 60
  # How many outgoing messages may wait for the broker. Once it is full, further messages are
  # dropped with one warning instead of piling up until the server runs out of memory.
  queue-size: 1000
  # The names below are base names. Voxen listens on '<name>.broadcast' plus its own
  # '<name>.server.<server-id>', so a private message for one server is not sent to the rest.
  redis:
    host: localhost
    port: 6379
    username: ""
    password: ""
    ssl: false
    channel: "voxen:chat"
  nats:
    url: "nats://localhost:4222"
    username: ""
    password: ""
    subject: "voxen.chat"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: "/"
    exchange: "voxen.chat"
